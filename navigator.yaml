# TODO: Update this file when you clone the template.
#
# initiative: Always 'siren' for Siren extensions
#
# knowledgeDependencies tells Navigator (and AI agents) which KB entries
# are relevant when working on this project. The PHPNomad and Siren
# dependencies are critical — they contain the framework patterns and
# coding standards that this extension must follow.
#
# Only canonical fields are supported here (see KB: navigator-yaml-schema):
# initiative, charter_id, knowledgeDependencies, ci.

initiative: siren
ci:
  setup: composer install
autoMerge:
  enabled: true
  rubric: global-auto-merge-review-rubric
  allowedCategories: [docs]          # proven-safe category; widen as trust grows
  alwaysHuman: [payments, migrations, auth, security]
knowledgeDependencies:
  - initiative: phpnomad
    description: "PHPNomad framework patterns and coding standards"
    critical:
      - initiatives-nomadic-development-start-here
      - initiatives-nomadic-development-anti-patterns-anti-patterns
      - initiatives-nomadic-development-coding-standards-the-stack-elevator
      - global-definition-of-done
      - global-failure-and-logging-doctrine
      - global-unit-testing-standards-modifying-existing-tests
      - global-taxonomy-and-sdk-doctrine
      - global-integration-testing-standards-introduction
      - global-e2e-testing-standards-introduction
      - global-pattern-decidability-doctrine
      - global-silent-failure-rules
  - initiative: siren
    description: "Siren documentation and extension patterns"
    critical:
      - siren-extension-development-guide
  - initiative: navigator
    description: "Autonomous worker conventions"
    critical:
      - conventions-autonomous-worker
